<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmPath · Your ideas</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="feedback.css"></head><body><header class="topbar"><a class="wordmark" href="index.html">EmPath</a><nav aria-label="Main navigation"><a href="index.html">Story</a><a href="app.html">Tool</a><a href="method.html">Method</a><a href="feedback.html" aria-current="page">Ideas</a></nav></header><main class="content feedback-content"><p class="eyebrow">Help shape EmPath</p><h1>How can we improve?</h1><p class="feedback-intro">Share an idea, or support one that would make a difference to you.</p><form id="feedback-form" name="empath-feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="empath-feedback"><p hidden><label>Leave this empty<input name="bot-field"></label></p><label for="feedback-text">What would make EmPath more useful to you?</label><textarea id="feedback-text" name="message" rows="6" maxlength="4000" required placeholder="A missing destination, an unclear route, a city we should try next…"></textarea><input type="hidden" name="share-publicly" value="yes"><button class="button" type="submit">Send idea</button><p id="feedback-status" role="status"></p></form><section class="feedback-board" aria-labelledby="feedback-board-title"><div class="feedback-board-heading"><div><h2 id="feedback-board-title">What people have said</h2></div><span class="feedback-sort">Most helpful first</span></div><p id="board-status" role="status">Loading submitted ideas…</p><div id="feedback-list"></div><button type="button" class="button secondary" id="retry-feedback" hidden>Try again</button><noscript><p>Enable JavaScript to see and vote on community ideas.</p></noscript></section></main><script src="feedback.js"></script><script src="journey.js"></script></body></html>
